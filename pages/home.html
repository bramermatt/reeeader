    <!-- Light Mode Favicon -->

    <!-- Dark Mode Favicon -->
    <link id="favicon-dark" rel="shortcut icon" type="image/x-icon" rel="icon" href="../img/fav/reeeader-fav-darkmode.svg" media="(prefers-color-scheme: dark)">

<body>

<main>

    <div class="grid-three-columns">
        


    <article id="currently-reading">
        <h1>Currently Reading</h1>

        <div class="currently-reading-book">
        <div class="currently-reading-content">
            <img src="../img/bookcover-placeholder.jpg" alt="">
                <div class="currently-reading-info">
                    <h4>Book Series</h4>
                    <h2>Book Title</h2>
                    <h3>by Book Author</h3>

                    <button>Update Progress</button>
                </div>
            
        </div>
    </div>

        <div class="currently-reading-bonus">
            <button>View All Books</button>
            <button>Add Another Book</button>
            <button>General Update</button>
        </div>


    </article>


    
    <article id="the-feed">
        <h1>Feed*</h1>
    </article>


    
    <article id="news">
        <h1>News</h1>  
        <div id="news-feed"></div>
    </article>
        
    </div>

    </main>
